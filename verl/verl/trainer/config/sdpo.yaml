defaults:
  - ppo_trainer
  - user_runpod  # RunPod user configuration
  - _self_

# MAX_PROMPT_LENGTH=2048
# MAX_RESPONSE_LENGTH=8192
# MAX_FEEDBACK_LENGTH=8192
# TEMPLATE_LENGTH=512  # heuristic upper bound, not enforced
# MAX_MODEL_LEN=$((TEMPLATE_LENGTH + MAX_PROMPT_LENGTH + MAX_FEEDBACK_LENGTH + MAX_RESPONSE_LENGTH))
max_model_len: 18944

actor_rollout_ref:
  actor:
    # SDPO experiments use ppo_mini_batch_size=1 for fully on-policy updates
    ppo_mini_batch_size: 1
    # Disable remove_padding for SDPO (required for full-logit/topk distillation)
    use_remove_padding: false
    policy_loss:
      loss_mode: sdpo
    self_distillation:
      # Distillation settings (matching SDPO experiments/rich_feedback/run_sdpo.sh)
      alpha: 1.0  # reverse KL
      full_logit_distillation: true
      distillation_topk: 20  # experiments use top-20
      distillation_add_tail: true
      teacher_update_rate: 0.01  # EMA rate from experiments (ema_update_rate)
      # Reprompting settings
      max_reprompt_len: 10240
      is_clip: 2.0
      success_reward_threshold: 0.5
      include_environment_feedback: true
      dont_reprompt_on_self_success: true
      remove_thinking_from_demonstration: true  # Remove <think>...</think> from demonstrations
      environment_feedback_only_without_solution: true  # Only use feedback when no solution available
      # ============================================================
      # Improved SDPO settings (set use_improved_sdpo: true to enable)
      # ============================================================
      use_improved_sdpo: true  # Enable improved SDPO algorithm
      imitation_loss_weight: 0.5  # Weight for imitation KL loss (alpha in paper)
      # When enabled, the algorithm:
      # 1. Finds the best response (highest reward) in batch
      # 2. If best is not perfect, uses teacher+feedback+original_response to revise
      # 3. Compares revised vs original, picks better one
      # 4. Loss = imitation_kl (learn best) + sdpo_kl (reduce errors)
      improved_sdpo_min_reward_threshold: 0.3  # Min reward for best response to be used for imitation
      # Reprompting template - combines prompt, solution section, and feedback section
      reprompt_template: |-
        {prompt}{solution}{feedback}

        Correctly solve the original question.
      # Solution template - formats successful previous attempts
      solution_template: |-

        Correct solution:

        {successful_previous_attempt}

      # Feedback template - formats environment feedback from failed attempts
      feedback_template: |-

        The following is feedback from your unsuccessful earlier attempt:

        {feedback_raw}
      # Improved SDPO: Template for teacher revision (includes original response + feedback)
      revision_template: |-
        {prompt}

        Your previous attempt:

        {original_response}

        Feedback from your attempt:

        {feedback}

        Based on the feedback above, provide a corrected solution.
    optim:
      # SDPO experiments use lr=1e-6 (10x smaller than typical PPO)
      lr: 1e-6
      lr_warmup_steps: 0  # No warmup in SDPO experiments
  rollout:
    n: 8
    calculate_log_probs: True
    val_kwargs:
      n: 4  # SDPO experiments use 4 for validation

algorithm:
  adv_estimator: grpo # disables critic
  norm_adv_by_std_in_grpo: False
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

data:
  train_batch_size: 32

trainer:
  val_before_train: False
